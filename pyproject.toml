[project]
name = "c5-model"
version = "0.1.0"
description = "Reproducible legal terminology retrieval experiments for AMT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
c5-model = "c5_model.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c5_model"]

[tool.uv]
package = true

